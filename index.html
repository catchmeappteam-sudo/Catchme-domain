<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATCHME - 일정 공유 & 위치 기반 서비스</title>
    
    <!-- Open Graph (카카오톡/소셜 공유 카드) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="CATCHME - 더 쉬워지는 일정 & 위치 공유">
    <meta property="og:description" content="친구들과 실시간 일정 공유 및 위치 기반 서비스, CATCHME를 지금 시작해보세요.">
    <meta property="og:url" content="https://catchme-app.com">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .hero {
            text-align: center;
            padding: 80px 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 24px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 20px;
            color: #94a3b8;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .cta-button {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            font-size: 18px;
            font-weight: 700;
            padding: 16px 40px;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4);
        }

        .cta-button:hover {
            background-color: #0284c7;
            color: #ffffff;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid #1e293b;
            color: #64748b;
            font-size: 14px;
        }

        footer a {
            color: #38bdf8;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .contact-info {
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">CATCHME</div>
    </header>

    <main class="hero">
        <h1>일정과 위치를 한곳에서,<br>스마트한 공유의 시작</h1>
        <p>복잡했던 약속 잡기와 위치 공유를 CATCHME 하나로 쉽고 빠르게 해결하세요.</p>
        
        <!-- 실제 CATCHME 서비스 앱 연결 버튼 -->
        <a href="https://catchme-29rt.onrender.com" class="cta-button" target="_blank">CATCHME 시작하기</a>
    </main>

    <footer>
        <p>&copy; 2026 CATCHME. All rights reserved.</p>
        <div class="contact-info">
            문의하기: <a href="mailto:contact@catchme-app.com">contact@catchme-app.com</a>
        </div>
    </footer>

</body>
</html>
